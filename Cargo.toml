[package]
name = "claude-statusline"
version = "0.4.0"
edition = "2021"
description = "Fast, dependency-free statusline for Claude Code and Codex"
license = "MIT"
repository = "https://github.com/randomizedcoder/claude-statusline"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
